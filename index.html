<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小學成語大冒險</title>
  <style>
    :root {
      --bg-dark: #1a1a2e;
      --bg-mid: #16213e;
      --bg-panel: #0f3460;
      --accent: #e94560;
      --gold: #ffd700;
      --green: #4caf50;
      --red: #f44336;
      --text: #eaeaea;
      --text-dim: #8888aa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
    }

    body {
      font-family: "微軟正黑體", "Microsoft JhengHei", "PingFang TC", sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    #app {
      width: 100%;
      max-width: 520px;
      position: relative;
    }

    /* 預設 screen 隱藏 */
    .screen { display: none; }

    /* 首頁：block 讓關卡清單自然撐高，body 負責捲動 */
    #screen-home {
      display: none;
      padding: 16px;
      background: var(--bg-dark);
    }
    #screen-home.active { display: block; }

    /* 戰鬥畫面：flex column，高度至少撐滿螢幕，小手機可捲 */
    #screen-battle {
      display: none;
      flex-direction: column;
      min-height: 100svh;
      padding: 12px;
      background: linear-gradient(180deg, var(--bg-mid) 0%, var(--bg-dark) 100%);
    }
    #screen-battle.active { display: flex; }

    /* 其他畫面：flex column 置中 */
    #screen-result,
    #screen-levelup,
    #screen-gamecomplete {
      display: none;
      flex-direction: column;
      min-height: 100svh;
      padding: 16px;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    #screen-result.active,
    #screen-levelup.active,
    #screen-gamecomplete.active { display: flex; }

    /* 寶物圖鑑：block，正常捲動 */
    #screen-treasury {
      display: none;
      background: var(--bg-dark);
    }
    #screen-treasury.active { display: block; }

    /* ─── Buttons ─── */
    .btn {
      display: inline-block;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-gold    { background: var(--gold); color: #222; font-weight: bold; }
    .btn-dim     { background: var(--bg-panel); color: var(--text-dim); }
    .btn-danger  { background: var(--red); color: #fff; }
    .btn-block   { display: block; width: 100%; text-align: center; }

    /* ─── HOME ─── */

    .home-header {
      text-align: center;
      padding: 20px 0 12px;
    }
    .home-title {
      font-size: 26px;
      font-weight: bold;
      color: var(--gold);
      text-shadow: 0 0 12px rgba(255,215,0,0.4);
    }
    .home-subtitle { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
    .player-title-display {
      margin: 8px auto;
      background: var(--bg-panel);
      border: 1px solid var(--gold);
      border-radius: 8px;
      padding: 6px 16px;
      font-size: 14px;
      color: var(--gold);
      display: inline-block;
      cursor: pointer;
      user-select: none;
      transition: transform 0.08s;
    }
    .player-title-display:active { transform: scale(0.93); }

    .home-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 8px 0 12px;
    }

    .level-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 20px;
    }

    .level-card {
      background: var(--bg-mid);
      border: 1px solid var(--bg-panel);
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.1s;
    }
    .level-card:hover { border-color: var(--accent); transform: translateY(-1px); }
    .level-card.locked { opacity: 0.5; cursor: not-allowed; }
    .level-card.locked:hover { transform: none; border-color: var(--bg-panel); }

    .level-card-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .level-boss-emoji { font-size: 28px; }
    .level-info { flex: 1; }
    .level-name { font-size: 15px; font-weight: bold; }
    .level-sub  { font-size: 12px; color: var(--text-dim); }
    .level-wins { font-size: 12px; color: var(--green); }

    .level-treasures {
      display: flex;
      gap: 4px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .treasure-slot {
      width: 24px; height: 24px;
      background: var(--bg-dark);
      border: 1px solid #333;
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .treasure-slot.empty { color: #444; font-size: 12px; }

    .level-progress-bar {
      height: 4px;
      background: #333;
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
    }
    .level-progress-fill {
      height: 100%;
      background: var(--green);
      border-radius: 2px;
      transition: width 0.3s;
    }

    .boss-card {
      background: linear-gradient(135deg, #2d0a0a, #1a1a2e);
      border: 2px solid var(--accent);
    }
    .boss-card-locked {
      background: var(--bg-mid);
      border: 2px dashed #555;
      text-align: center;
      padding: 20px;
      border-radius: 10px;
      color: var(--text-dim);
    }

    /* ─── BATTLE ─── */

    .battle-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .back-btn {
      background: none;
      border: 1px solid #444;
      color: var(--text-dim);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }
    .back-btn:hover { border-color: var(--accent); color: var(--accent); }

    #boss-badge {
      display: none;
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 20px;
      animation: badgePulse 1s infinite alternate;
    }
    @keyframes badgePulse {
      from { box-shadow: 0 0 4px var(--accent); }
      to   { box-shadow: 0 0 14px var(--accent), 0 0 28px var(--accent); }
    }

    #battle-stage {
      position: relative;
      background: var(--bg-panel);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
    }

    /* side-by-side arena */
    .stage-arena {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 1;
      gap: 8px;
    }

    .player-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex: 1;
    }
    .player-sprite { font-size: 80px; line-height: 1; }
    .player-name   { font-size: 13px; color: var(--text-dim); }
    .player-hp     { display: flex; gap: 4px; font-size: 20px; }

    .vs-label {
      font-size: 18px;
      font-weight: bold;
      color: var(--text-dim);
      flex-shrink: 0;
      opacity: 0.5;
    }

    .boss-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex: 1;
    }
    .boss-name { font-size: 13px; color: var(--text-dim); text-align: center; }
    .boss-hp-bar {
      width: 100%;
      max-width: 160px;
      height: 10px;
      background: #333;
      border-radius: 5px;
      overflow: hidden;
    }
    .boss-hp-fill {
      height: 100%;
      background: var(--red);
      border-radius: 5px;
      transition: width 0.4s;
    }
    .boss-hp-text { font-size: 11px; color: var(--text-dim); }
    .boss-sprite {
      line-height: 1;
      text-align: center;
    }
    .boss-halo  { font-size: 20px; }
    .boss-main  { font-size: 80px; display: block; }
    .boss-weapon { font-size: 20px; }

    .stage-footer {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-dim);
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.05);
      margin-top: 8px;
    }

    #slash-effect {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 64px;
      pointer-events: none;
      opacity: 0;
      z-index: 10;
    }
    @keyframes slashAnim {
      0%   { transform: translate(-50%,-50%) scale(0) rotate(0deg); opacity: 1; }
      50%  { transform: translate(-50%,-50%) scale(1.6) rotate(180deg); opacity: 1; }
      100% { transform: translate(-50%,-50%) scale(0) rotate(360deg); opacity: 0; }
    }
    .slash-animate { animation: slashAnim 0.5s ease-out forwards; }

    /* damage numbers */
    .float-damage {
      position: absolute;
      right: 8%;
      top: 25%;
      font-weight: bold;
      pointer-events: none;
      z-index: 11;
      white-space: nowrap;
    }
    .float-damage.normal {
      color: #fff;
      font-size: 36px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      animation: floatUp 0.9s ease-out forwards;
    }
    .float-damage.crit {
      color: var(--gold);
      font-size: 46px;
      text-shadow: 0 0 12px #ff8c00, 0 0 24px #ff4400, 0 2px 8px rgba(0,0,0,0.9);
      animation: floatUpCrit 1.1s ease-out forwards;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-70px) scale(0.8); opacity: 0; }
    }
    @keyframes floatUpCrit {
      0%   { transform: translateY(0) scale(0.4); opacity: 1; }
      25%  { transform: translateY(-15px) scale(1.4); opacity: 1; }
      100% { transform: translateY(-90px) scale(0.9); opacity: 0; }
    }

    /* crit screen flash */
    #crit-flash {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(ellipse at center, rgba(255,180,0,0.25) 0%, rgba(255,60,0,0.1) 70%, transparent 100%);
      pointer-events: none;
      z-index: 50;
      opacity: 0;
    }
    @keyframes critFlashAnim {
      0%   { opacity: 1; }
      100% { opacity: 0; }
    }
    .crit-flashing { animation: critFlashAnim 0.5s ease-out forwards; }

    @keyframes bossHit {
      0%,100% { transform: translateX(0); filter: none; }
      25%      { transform: translateX(-10px); filter: brightness(3); }
      75%      { transform: translateX(10px); filter: brightness(2); }
    }
    .boss-hit { animation: bossHit 0.35s ease-out; }

    @keyframes bossHitCrit {
      0%   { transform: translateX(0) scale(1);    filter: none; }
      15%  { transform: translateX(-14px) scale(1.08); filter: brightness(4) hue-rotate(20deg); }
      35%  { transform: translateX(14px) scale(0.94); filter: brightness(5) saturate(2); }
      55%  { transform: translateX(-8px) scale(1.04); filter: brightness(3); }
      75%  { transform: translateX(8px) scale(0.98);  filter: brightness(2); }
      100% { transform: translateX(0) scale(1);    filter: none; }
    }
    .boss-hit-crit { animation: bossHitCrit 0.55s ease-out; }

    @keyframes playerHit {
      0%,100% { opacity: 1; }
      25%,75% { opacity: 0.2; }
      50%     { opacity: 0.8; }
    }
    .player-hit { animation: playerHit 0.5s ease-out; }

    @keyframes finalBossGlow {
      0%   { filter: drop-shadow(0 0 6px #e94560); }
      50%  { filter: drop-shadow(0 0 20px #ff6b35) drop-shadow(0 0 40px #e94560); }
      100% { filter: drop-shadow(0 0 6px #e94560); }
    }
    .final-boss-glow { animation: finalBossGlow 1.5s ease-in-out infinite; }

    .question-area {
      background: var(--bg-mid);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .question-prompt {
      font-size: 16px;
      line-height: 1.7;
      margin-bottom: 12px;
      text-align: center;
    }
    .blank { color: var(--gold); font-weight: bold; border-bottom: 2px solid var(--gold); padding: 0 4px; }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .option-btn {
      background: var(--bg-panel);
      border: 2px solid transparent;
      border-radius: 8px;
      padding: 12px 10px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      text-align: center;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .option-btn:hover  { border-color: var(--accent); }
    .option-btn.selected { border-color: var(--gold); background: rgba(255,215,0,0.1); }
    .option-btn:disabled { cursor: not-allowed; opacity: 0.6; }
    .option-word { font-size: 18px; font-weight: bold; display: block; }

    /* 共用說明欄 */
    .option-meaning-box {
      min-height: 56px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 8px;
      padding: 10px 14px;
      margin-top: 10px;
      font-size: 18px;
      color: var(--text);
      line-height: 1.7;
      transition: opacity 0.2s;
    }
    .option-meaning-box.empty { opacity: 0.3; }

    .confirm-area {
      text-align: center;
      margin-top: 10px;
    }

    /* ─── RESULT ─── */
    #screen-result { background: var(--bg-dark); }
    .result-icon { font-size: 72px; margin-bottom: 12px; }
    .result-title { font-size: 28px; font-weight: bold; margin-bottom: 8px; }
    .result-title.win  { color: var(--gold); }
    .result-title.lose { color: var(--accent); }
    .result-stats { font-size: 14px; color: var(--text-dim); margin-bottom: 20px; line-height: 2; }
    .result-treasure { font-size: 13px; color: var(--gold); margin-bottom: 16px; }

    /* ─── LEVELUP ─── */
    #screen-levelup { background: radial-gradient(ellipse at center, #1a1040 0%, var(--bg-dark) 70%); }
    .levelup-title { font-size: 18px; color: var(--text-dim); margin-bottom: 8px; }
    .title-card {
      background: linear-gradient(135deg, #2a1a00, #1a1a2e);
      border: 2px solid var(--gold);
      border-radius: 12px;
      padding: 20px 32px;
      margin: 12px 0;
      box-shadow: 0 0 20px rgba(255,215,0,0.3);
    }
    .title-card-name { font-size: 28px; font-weight: bold; color: var(--gold); }
    .next-boss-preview { margin-top: 16px; font-size: 14px; color: var(--text-dim); }
    .next-boss-emoji   { font-size: 40px; display: block; margin: 4px 0; }

    /* particle */
    #particles-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 100;
    }
    .particle {
      position: absolute;
      font-size: 20px;
      animation: particleFly 1.2s ease-out forwards;
    }
    @keyframes particleFly {
      0%   { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }

    /* ─── GAMECOMPLETE ─── */
    #screen-gamecomplete { background: radial-gradient(ellipse at center, #1a0030 0%, var(--bg-dark) 70%); }
    .trophy-icon { font-size: 80px; animation: trophySpin 2s linear infinite; display: block; margin: 0 auto 12px; }
    @keyframes trophySpin {
      from { transform: rotateY(0deg); }
      to   { transform: rotateY(360deg); }
    }
    .complete-title { font-size: 28px; font-weight: bold; color: var(--gold); margin-bottom: 8px; }
    .titles-list { margin: 12px 0; text-align: left; max-width: 280px; }
    .titles-list li { list-style: none; padding: 4px 0; font-size: 13px; color: var(--text-dim); }
    .titles-list li span { color: var(--gold); }

    /* ─── TREASURY ─── */
    .treasury-header {
      position: sticky;
      top: 0;
      background: var(--bg-dark);
      border-bottom: 1px solid var(--bg-panel);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 20;
    }
    .treasury-title { flex: 1; text-align: center; font-size: 18px; font-weight: bold; color: var(--gold); }
    .treasury-count { font-size: 13px; color: var(--text-dim); }

    .treasury-body { padding: 12px 16px; }

    .treasury-level-block {
      background: var(--bg-mid);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .treasury-level-title {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 8px;
    }
    .treasury-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .treasury-slot {
      aspect-ratio: 1;
      background: var(--bg-dark);
      border: 1px solid #333;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    .treasury-slot.empty { color: #444; font-size: 18px; }
    .treasury-slot-name { font-size: 9px; color: var(--text-dim); margin-top: 2px; }

    .crown-slot {
      width: 140px;
      height: 140px;
      background: var(--bg-mid);
      border: 2px solid #444;
      border-radius: 12px;
      margin: 12px auto 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      position: relative;
    }
    .crown-slot.earned {
      border-color: var(--gold);
      animation: crownGlow 2s ease-in-out infinite;
    }
    .crown-slot.earned::before,
    .crown-slot.earned::after {
      content: "✨";
      position: absolute;
      font-size: 14px;
    }
    .crown-slot.earned::before { top: 6px; left: 6px; }
    .crown-slot.earned::after  { bottom: 6px; right: 6px; }
    @keyframes crownGlow {
      0%,100% { box-shadow: 0 0 8px rgba(255,215,0,0.4); }
      50%      { box-shadow: 0 0 24px rgba(255,215,0,0.8), 0 0 48px rgba(255,215,0,0.4); }
    }
    @keyframes crownFloat {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    .crown-emoji { animation: crownFloat 2s ease-in-out infinite; display: block; }

    /* player stage glow */
    .player-stage-2 { filter: drop-shadow(0 0 6px #4488ff); }
    @keyframes stage3Glow {
      0%,100% { filter: drop-shadow(0 0 6px var(--gold)); }
      50%      { filter: drop-shadow(0 0 16px var(--gold)) drop-shadow(0 0 32px #ffaa00); }
    }
    .player-stage-3 { animation: stage3Glow 1.5s ease-in-out infinite; }
  </style>
</head>
<body>
<div id="app">

  <!-- ══════════════ SCREEN: HOME ══════════════ -->
  <div id="screen-home" class="screen">
    <div class="home-header">
      <div class="home-title">⚔️ 小學成語大冒險</div>
      <div class="home-subtitle">打倒魔王，成為成語王！</div>
      <div id="player-title-display" class="player-title-display"></div>
    </div>
    <div class="home-actions">
      <button class="btn btn-dim" onclick="showTreasury()">📖 寶物圖鑑</button>
      <button class="btn btn-danger" onclick="confirmReset()">重置</button>
    </div>
    <div id="level-grid" class="level-grid"></div>
  </div>

  <!-- ══════════════ SCREEN: BATTLE ══════════════ -->
  <div id="screen-battle" class="screen">
    <div class="battle-header">
      <button class="back-btn" onclick="confirmBackHome()">← 回首頁</button>
      <div id="boss-badge">⚠ 究極魔獸 ⚠</div>
    </div>

    <div id="battle-stage">
      <div class="stage-arena">
        <!-- 玩家（左） -->
        <div class="player-area">
          <div id="player-sprite" class="player-sprite"></div>
          <div id="player-name" class="player-name"></div>
          <div id="player-hp" class="player-hp"></div>
        </div>
        <div class="vs-label">VS</div>
        <!-- Boss（右） -->
        <div class="boss-area">
          <div id="boss-name" class="boss-name"></div>
          <div class="boss-hp-bar"><div id="boss-hp-fill" class="boss-hp-fill" style="width:100%"></div></div>
          <div id="boss-hp-text" class="boss-hp-text"></div>
          <div id="boss-sprite" class="boss-sprite"></div>
        </div>
      </div>
      <div class="stage-footer">
        <div id="counter-correct">本場答對：0</div>
        <div id="counter-wins">累計勝場：-</div>
      </div>
      <div id="slash-effect">⚔️</div>
    </div>

    <div class="question-area">
      <div id="question-prompt" class="question-prompt"></div>
      <div id="options-grid" class="options-grid"></div>
      <div id="option-meaning-box" class="option-meaning-box empty">點選成語查看解釋</div>
      <div class="confirm-area">
        <button id="confirm-btn" class="btn btn-primary" onclick="confirmAnswer()" style="display:none">確定</button>
      </div>
    </div>
  </div>

  <!-- ══════════════ SCREEN: RESULT ══════════════ -->
  <div id="screen-result" class="screen">
    <div id="result-icon" class="result-icon"></div>
    <div id="result-title" class="result-title"></div>
    <div id="result-stats" class="result-stats"></div>
    <div id="result-treasure" class="result-treasure"></div>
    <button id="result-continue-btn" class="btn btn-gold" onclick="onResultContinue()"></button>
  </div>

  <!-- ══════════════ SCREEN: LEVELUP ══════════════ -->
  <div id="screen-levelup" class="screen">
    <div class="levelup-title">🎊 解鎖新等級！</div>
    <div class="title-card">
      <div id="levelup-title-name" class="title-card-name"></div>
    </div>
    <div id="next-boss-preview" class="next-boss-preview"></div>
    <button class="btn btn-gold" style="margin-top:20px" onclick="showHome()">出發冒險！</button>
  </div>

  <!-- ══════════════ SCREEN: GAMECOMPLETE ══════════════ -->
  <div id="screen-gamecomplete" class="screen">
    <span class="trophy-icon">🏆</span>
    <div class="complete-title">✨ 究極成語王 ✨</div>
    <div style="font-size:14px;color:var(--text-dim);margin-bottom:12px">恭喜你打敗所有魔王！</div>
    <ul id="titles-list" class="titles-list"></ul>
    <button class="btn btn-gold" onclick="confirmReset()">再玩一次</button>
  </div>

  <!-- ══════════════ SCREEN: TREASURY ══════════════ -->
  <div id="screen-treasury" class="screen">
    <div class="treasury-header">
      <button class="back-btn" onclick="showHome()">← 返回</button>
      <div class="treasury-title">📖 寶物圖鑑</div>
      <div id="treasury-count" class="treasury-count"></div>
    </div>
    <div class="treasury-body">
      <div id="treasury-levels"></div>
      <div id="crown-slot" class="crown-slot">
        <span style="font-size:18px;color:var(--text-dim)">🔒</span>
      </div>
    </div>
  </div>

</div>

<div id="particles-container"></div>
<div id="crit-flash"></div>

<script src="words.js"></script>
<script src="game.js"></script>
</body>
</html>
